      return {};

binary_sensor:
  # ✅ VERIFIED 2025-10-15: Compressor status from CAN ID 480, elster_idx 95
  # Command message from Manager (0x480) to Pump (0x180)
  # OFF: raw_value = 0 (a0 08 5f 00 00 00 00)
  # ON:  raw_value = 512 (a0 08 5f 02 00 00 00)
  - platform: template
    name: COMPRESSOR_RUNNING
    id: COMPRESSOR_RUNNING
    device_class: running
    icon: mdi:engine

text_sensor:
  - platform: template
    name: DEVICE_ID_MANAGER
    id: GERAETE_ID_MANAGER
    icon: mdi:description
  - platform: template
    name: CAN Signal
    id: received_can_signal
    icon: mdi:description

switch:
  # Restart ESP device
  - platform: restart
    name: "WP ESP restart"
    id: restart_esp_heatpump

time:
  - platform: sntp
    on_time:
      - seconds: 0
        minutes: 0
        hours: 4
        days_of_week: 1
        then:
          - switch.toggle: restart_esp_heatpump

spi:
  id: McpSpi
  clk_pin: GPIO18 # SCK
  mosi_pin: GPIO17 # SI
  miso_pin: GPIO16 # SO


canbus:
  - platform: mcp2515
    id: my_mcp2515
    spi_id: McpSpi
    cs_pin: GPIO4 # CS
    can_id: 0x680
    use_extended_id: false
    bit_rate: 20kbps
    on_frame:
      - can_id: 0x180
        then:
          - lambda: |-
              unsigned short canId = 180;
              std::string value;
              const ElsterIndex* ei = processCanMessage(canId, value, x);

              if(strcmp(ei->EnglishName, "ERROR_MESSAGE") == 0) {
                id(ERROR_MESSAGE).publish_state(std::stof(value));
                return;
              }
              if(strcmp(ei->EnglishName, "OUTSIDE_TEMP") == 0) {
                id(OUTSIDE_TEMP).publish_state(std::stof(value));
                return;
              }
              if(strcmp(ei->EnglishName, "RETURN_FLOW_INTERNAL_TEMP") == 0) {
                id(RETURN_FLOW_INTERNAL_TEMP).publish_state(std::stof(value));
                return;
              }
              if(strcmp(ei->EnglishName, "FLOW_INTERNAL_TEMP_HK1") == 0) {
                id(FLOW_INTERNAL_TEMP_HK1).publish_state(std::stof(value));
                return;
              }
              if(strcmp(ei->EnglishName, "STORAGE_TANK_INTERNAL_TEMP") == 0) {
                id(STORAGE_TANK_INTERNAL_TEMP).publish_state(std::stof(value) + 3);
                return;
              }
              if(strcmp(ei->EnglishName, "SOURCE_ACTUAL") == 0) {
                id(SOURCE_ACTUAL).publish_state(std::stof(value));
                return;
              }
              if(strcmp(ei->EnglishName, "HEATING_RETURN_ACTUAL") == 0) {
                id(HEATING_RETURN_ACTUAL).publish_state(std::stof(value));
                return;
              }
              if(strcmp(ei->EnglishName, "BUFFER_SETPOINT") == 0) {
                id(BUFFER_SETPOINT).publish_state(std::stof(value));
                return;
              }

      - can_id: 0x301
        then:
          - lambda: |-
              unsigned short canId = 301;
              std::string value;
              const ElsterIndex* ei = processCanMessage(canId, value, x);

              if(strcmp(ei->EnglishName, "FLOW_SETPOINT_TEMP") == 0) {
                id(FLOW_SETPOINT_TEMP_HK1).publish_state(std::stof(value));
                return;
              }
              if(strcmp(ei->EnglishName, "STORAGE_TANK_SETPOINT_TEMP") == 0) {
                id(STORAGE_TANK_SETPOINT_TEMP).publish_state(std::stof(value));
                return;
              }


      - can_id: 0x480
        then:
          - lambda: |-
              unsigned short canId = 480;
              std::string value;
              const ElsterIndex* ei = processCanMessage(canId, value, x);

              if(strcmp(ei->EnglishName, "ERROR_MESSAGE") == 0) {
                id(ERROR_MESSAGE_MANAGER).publish_state(std::stoi(value));
                return;
              }

              // ✅ VERIFIED 2025-10-15: Compressor start command (elster_idx 95)
              // Manager sends command to Pump: OFF=0, ON=512
              if(ei->Index == 95) {
                int raw_value = std::stoi(value);
                bool compressor_on = (raw_value > 0);
                id(COMPRESSOR_RUNNING).publish_state(compressor_on);
                return;
              }

      - can_id: 0
        then:
          - lambda: |-
              unsigned short canId = 000;
              std::string value;
              const ElsterIndex* ei = processCanMessage(canId, value, x);
      - can_id: 0x100
        then:
          - lambda: |-
              unsigned short canId = 100;
              std::string value;
              const ElsterIndex* ei = processCanMessage(canId, value, x);
      - can_id: 0x301
        then:
          - lambda: |-
              unsigned short canId = 301;
              std::string value;
              const ElsterIndex* ei = processCanMessage(canId, value, x);

      - can_id: 0x509
        then:
          - lambda: |-
              unsigned short canId = 509;
              std::string value;
              const ElsterIndex* ei = processCanMessage(canId, value, x);
      - can_id: 0x514
        then:
          - lambda: |-
              unsigned short canId = 514;
              std::string value;
              const ElsterIndex* ei = processCanMessage(canId, value, x);
      - can_id: 0x601
        then:
          - lambda: |-
              unsigned short canId = 601;
              std::string value;
              const ElsterIndex* ei = processCanMessage(canId, value, x);
      - can_id: 0x602
        then:
          - lambda: |-
              unsigned short canId = 602;
              std::string value;
              const ElsterIndex* ei = processCanMessage(canId, value, x);
      - can_id: 0x603
        then:
          - lambda: |-
              unsigned short canId = 603;
              std::string value;
              const ElsterIndex* ei = processCanMessage(canId, value, x);
      - can_id: 0x680
        then:
          - lambda: |-
              unsigned short canId = 680;
              std::string value;
              const ElsterIndex* ei = processCanMessage(canId, value, x);
      - can_id: 0x700
        then:
          - lambda: |-
              unsigned short canId = 700;
              std::string value;
              const ElsterIndex* ei = processCanMessage(canId, value, x);

