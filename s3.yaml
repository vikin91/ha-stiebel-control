esphome:
  name: heatingpump
  friendly_name: Heating Pump CAN Interface S3
  project:
    name: "canbus.stiebel-eltron-wpf10m"
    version: "0.1.4"
  includes:
    - stiebeltools/ElsterTable.h
    - stiebeltools/KElsterTable.cpp
    - stiebeltools/KElsterTable.h
    - stiebeltools/NUtils.h
    - stiebeltools/NUtils.cpp
    - stiebeltools/NTypes.h
    - stiebeltools/heatingpump.h
    - stiebeltools/CanMessageMqttLogger.h

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

mqtt:
  broker: 192.168.178.11
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  id: ha_mqtt

ota:
  platform: esphome
  encryption:
  # id: my_ota
  # password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB
    # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "S3 Fallback Hotspot"
    password: !secret fallback_wifi_password

# Enable Home Assistant API
api:
  encryption:
    key: !secret ota_api_key
logger:
  level: INFO
captive_portal:

sensor:
  ### FROM PUMP
  - platform: template
    name: OUTSIDE_TEMP
    id: OUTSIDE_TEMP
    unit_of_measurement: °C
    icon: mdi:thermometer-lines
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10min
    lambda: |-
      readSignal(&CanMembers[cm_pump], GetElsterIndex("OUTSIDE_TEMP"));
      return {};
