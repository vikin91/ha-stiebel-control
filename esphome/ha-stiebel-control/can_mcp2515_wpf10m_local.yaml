# MCP2515 wiring and CAN rate match the deployed s3.yaml installation.
spi:
  id: McpSpi
  clk_pin: ${can_clk_pin}
  mosi_pin: ${can_mosi_pin}
  miso_pin: ${can_miso_pin}

canbus:
  - platform: mcp2515
    id: my_can
    spi_id: McpSpi
    cs_pin: ${can_cs_pin}
    can_id: ${can_id_pc}
    use_extended_id: false
    bit_rate: 20kbps
    on_frame:
      - can_id: 0
        can_id_mask: 0
        then:
          - lambda: |-
              if (x.size() < 7) return;
              // WPF10M sensors use the explicit sender/index mapping below.
              // The generic upstream path auto-publishes unverified MQTT values.
              #ifndef WPF10M_SENSOR_ONLY
              processAndUpdate(can_id, x);
              #endif
              processWpf10mFrame(can_id, x);
