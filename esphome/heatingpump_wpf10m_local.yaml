# Trial firmware for the deployed ESP32-S3 + MCP2515 WPF10M installation.
# Based on upstream v2.1.1; keep the fork's v0.1.6 firmware as the rollback point.
# First hardware test: deployed poll list, CAN parameter writes blocked.
# Upstream extra probes and raw MQTT discovery are disabled by default.
substitutions:
  device_name: heatingpump
  friendly_name: Heating Pump CAN Interface S3
  device_model: "wpf10m"
  language: "EN"
  can_clk_pin: GPIO18
  can_mosi_pin: GPIO17
  can_miso_pin: GPIO16
  can_cs_pin: GPIO4
  can_id_pc: "0x680"

packages:
  can: !include ha-stiebel-control/can_mcp2515_wpf10m_local.yaml
  base: !include ha-stiebel-control/common.yaml
  sensors: !include ha-stiebel-control/wpf10m_local.yaml

esphome:
  friendly_name: Heating Pump CAN Interface S3
  platformio_options:
    build_flags:
      - "-DWPF10M_READ_ONLY"
      - "-DWPF10M_SENSOR_ONLY"
      # Later comparison: opt in to upstream WPF10 probes.
      # - "-DWPF10M_UPSTREAM_PROBES"
      # Optional raw CAN MQTT discovery stream.
      # - "-DWPF10M_RAW_MQTT"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Match the secrets already used by the working s3.yaml configuration.
api:
  encryption:
    key: !secret ota_api_key

ota:
  platform: esphome
  password: !remove
  encryption:

mqtt:
  broker: 192.168.178.11
  port: 1883
  # Keep the broker connection for shared upstream code, but do not install
  # its unverified MQTT discovery or command handlers for this trial.
  on_connect: !remove
  on_message: !remove

# These shared-package controls and background reads are not part of the
# deployed WPF10M sensor map. Keep the weekly restart button from the model
# package and the normal device-management buttons.
sensor:
  - id: !remove PROGRAMMSCHALTER
  - id: !remove SOMMERBETRIEB
  - id: !remove WW_ECO

button:
  - id: !remove update_uhrzeit
  - id: !remove update_datum
  - id: !remove republish_mqtt_discoveries

logger:
  # The upstream decoder logs every passive frame using German table keys.
  # Show concise English logs for the mapped WPF10M sensors instead.
  logs:
    "processCanMessage()": WARN
    "readSignal()": WARN
    MQTT_DISC: WARN

wifi:
  use_address: heatingpump.local
  output_power: 8.5dB
  ap:
    ssid: "S3 Fallback Hotspot"
    password: !secret fallback_wifi_password
